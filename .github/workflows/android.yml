name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Accept Android SDK licenses
        run: SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1); yes | "$SDKMANAGER" --licenses
      - name: Install Android SDK
        run: SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1); "$SDKMANAGER" "platforms;android-33" "build-tools;33.0.2"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Test HTTPS on Android 4.4 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 19
          target: default
          arch: x86
          profile: Nexus 5
          script: gradle --no-daemon connectedAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: HebrewAIChat-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
