plugins { id 'com.android.application' }

android {
    namespace 'il.co.aichat.hebrew'
    compileSdk 33
    defaultConfig {
        applicationId 'il.co.aichat.hebrew'
        minSdk 16
        targetSdk 28
        versionCode 2
        versionName '1.2'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Refresh Google's officially published CA roots at build time. This avoids pinning
// a single root certificate while supporting legacy Android system trust stores.
tasks.register("downloadGoogleRoots") {
    def rootsFile = file("src/main/res/raw/google_roots.pem")
    outputs.file(rootsFile)
    doLast {
        rootsFile.parentFile.mkdirs()
        new URL("https://pki.goog/roots.pem").withInputStream { input ->
            rootsFile.withOutputStream { output -> output << input }
        }
        if (!rootsFile.exists() || rootsFile.length() < 1000) {
            throw new GradleException("Google CA root bundle download failed")
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("downloadGoogleRoots")
}
