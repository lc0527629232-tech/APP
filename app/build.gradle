plugins { id 'com.android.application' }

android {
    namespace 'il.co.aichat.hebrew'
    compileSdk 33
    defaultConfig {
        applicationId 'il.co.aichat.hebrew'
        minSdk 14
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
